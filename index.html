<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Enchères Live</title>
<style>
  body { font-family: Arial; background: #f7f7f7; padding: 20px; }
  .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px #ccc; }
  input, button { width: 100%; padding: 10px; margin: 5px 0; font-size: 1rem; }
  #messages, #players { border: 1px solid #ccc; height: 150px; overflow-y: auto; padding: 10px; background: #fafafa; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h2>Enchères Live</h2>

  <div id="setup">
    <input type="text" id="userName" placeholder="Entrez votre pseudo">
    <button id="createRoomBtn">Créer Salle</button>
    <input type="text" id="joinCode" placeholder="Code de salle (4 chiffres)">
    <button id="joinRoomBtn">Rejoindre Salle</button>
  </div>

  <div id="auctionUI" class="hidden">
    <p>Salle : <span id="roomCodeDisplay"></span></p>
    <p>Objet : <span id="itemName">Aucun objet</span></p>
    <p>Dernière enchère : <span id="currentBid">0</span> €</p>

    <div id="playerControls" class="hidden">
      <input type="number" id="bidAmount" placeholder="Ton enchère">
      <button id="placeBidBtn">Proposer</button>
    </div>

    <div id="managerControls" class="hidden">
      <input type="text" id="newItemName" placeholder="Nom de l'objet">
      <button id="announceItemBtn">Annonce Objet</button>
      <button id="stopAuctionBtn">Stop Enchères</button>
    </div>

    <h3>Joueurs connectés :</h3>
    <div id="players"></div>

    <div id="messages"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

// 🔧 Config Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAtQO7VCsE3QInt1BzjjDfv6Ig621x5lGU",
  authDomain: "encheres-405e0.firebaseapp.com",
  databaseURL: "https://encheres-405e0-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "encheres-405e0",
  storageBucket: "encheres-405e0.firebasestorage.app",
  messagingSenderId: "432915114801",
  appId: "1:432915114801:web:d84ad61b1461bd33f79e10",
  measurementId: "G-LKEWRVCNEK"
};

// 🔧 Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Variables
let roomCode = null;
let isManager = false;
let userName = "";

const messages = document.getElementById("messages");
const playersDiv = document.getElementById("players");

function log(msg) {
  messages.innerHTML += msg + "<br>";
  messages.scrollTop = messages.scrollHeight;
}

function generateCode() {
  return Math.floor(1000 + Math.random() * 9000).toString();
}

// Mettre à jour la liste des joueurs
function updatePlayers() {
  onValue(ref(db, `rooms/${roomCode}/players`), snapshot => {
    const data = snapshot.val() || {};
    playersDiv.innerHTML = Object.values(data).map(name => name).join("<br>");
  });
}

// Créer salle
document.getElementById("createRoomBtn").onclick = async () => {
  userName = document.getElementById("userName").value.trim();
  if (!userName) return alert("Entrez un pseudo");

  roomCode = generateCode();
  isManager = true;

  await set(ref(db, "rooms/" + roomCode), { item: "Pas encore choisi", currentBid: 0, auctionOpen: true, players: { [userName]: userName } });
  showAuctionUI();

  // Supprimer le joueur si il se déconnecte
  onDisconnect(ref(db, `rooms/${roomCode}/players/${userName}`)).remove();

  log("Salle créée ! Code : " + roomCode);
};

// Rejoindre salle
document.getElementById("joinRoomBtn").onclick = async () => {
  userName = document.getElementById("userName").value.trim();
  if (!userName) return alert("Entrez un pseudo");

  const code = document.getElementById("joinCode").value.trim();
  const snapshot = await get(ref(db, "rooms/" + code));
  if (!snapshot.exists()) return alert("Salle introuvable");

  roomCode = code;
  isManager = false;

  // Ajouter le joueur à la liste
  await set(ref(db, `rooms/${roomCode}/players/${userName}`), userName);

  // Supprimer le joueur si il se déconnecte
  onDisconnect(ref(db, `rooms/${roomCode}/players/${userName}`)).remove();

  showAuctionUI();
  log("Tu as rejoint la salle " + code);
};

// Afficher l'UI d'enchères
function showAuctionUI() {
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("auctionUI").classList.remove("hidden");
  document.getElementById("roomCodeDisplay").textContent = roomCode;
  if (isManager) document.getElementById("managerControls").classList.remove("hidden");
  else document.getElementById("playerControls").classList.remove("hidden");

  updatePlayers();

  // Écoute en temps réel pour les enchères et l'objet
  onValue(ref(db, "rooms/" + roomCode), snapshot => {
    const data = snapshot.val();
    if (!data) return;
    document.getElementById("itemName").textContent = data.item;
    document.getElementById("currentBid").textContent = data.currentBid;
  });
}

// Gérant annonce un objet
document.getElementById("announceItemBtn").onclick = async () => {
  const it = document.getElementById("newItemName").value.trim();
  if (!it) return;
  await update(ref(db, "rooms/" + roomCode), { item: it });
  log("Objet annoncé : " + it);
};

// Gérant stoppe les enchères
document.getElementById("stopAuctionBtn").onclick = async () => {
  await update(ref(db, "rooms/" + roomCode), { auctionOpen: false });
  log("Enchères terminées !");
};

// Joueur propose une enchère
document.getElementById("placeBidBtn").onclick = async () => {
  const bid = parseFloat(document.getElementById("bidAmount").value);
  const snapshot = await get(ref(db, "rooms/" + roomCode));
  const data = snapshot.val();
  if (!data || !data.auctionOpen) return alert("Enchères fermées");
  if (isNaN(bid) || bid <= data.currentBid) return alert("Tu dois proposer plus que " + data.currentBid + " €");
  await update(ref(db, "rooms/" + roomCode), { currentBid: bid });
  log(userName + " propose : " + bid + " €");
};
</script>
